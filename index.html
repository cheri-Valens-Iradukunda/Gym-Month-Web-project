<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) => {
        fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
    }

    window.onload = () => {
        loadComponents('home_bottom_part', 'src/sections/home_bottom_part.html');
        // loadComponents('privacy_part', 'src/sections/privacy_part.html')
        // loadComponents('contact', 'src/sections/contact.html');
        // loadComponents('footer', 'src/sections/footer.html');
    }
</script>

<body>

    <div id="home_bottom_part">
    </div>
    <!-- <div id="privacy_part"></div> -->
    <!-- <div id="hero"></div>
    <div id="contact"></div>
    <div id="footer"></div>  -->
</body>

</html>
