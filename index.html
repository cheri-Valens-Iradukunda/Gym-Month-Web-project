
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
 </head>
<body class="overflow-hidden">
    <div id="navigation"></div>
    <div class="h-[150vh] pt-40 relative bg-blac">
        <div id="home_upper" ></div>
    </div>
    <script defer src="src/js/nav.js"></script>
    <script>
        const loadComponents = (id, url) =>  {
            return fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = async () => {
            // load navbar first so scripts can attach
            await loadComponents('navigation', 'src/sections/navigation.html');
            // init nav handlers that expect elements inside the injected navbar
            if (window.initNav) window.initNav();

            // load the rest (can be async)
            loadComponents('home_upper_part', 'src/sections/home_upper_part.html');
            loadComponents('home_upper', 'src/sections/home_upper.html');
        }
    </script>
</body>
</html>
