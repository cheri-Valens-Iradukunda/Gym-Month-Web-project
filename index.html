<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <title>Website project template</title>
</head>
<script>
    const loadComponents = (id, url) =>  {
        fetch(url)
        .then((response) => response.text())
        .then((html) => {
            document.getElementById(id).innerHTML = html;
        });
    }

    window.onload = () => {
        loadComponents('home_upper_part', 'src/sections/home_upper_part.html');
        loadComponents('home_upper', 'src/sections/home_upper.html');
    }
</script>
<body class="">
    <div class="h-[150vh] relative bg-blac">
        <div id="home_upper" ></div>
    </div>
</body>
</html>
