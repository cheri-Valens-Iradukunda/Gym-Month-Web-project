
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/dist/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Website project template</title>
 </head>
<body class="overflow-x-hidden ">
    <div id="nav" class="fixed w-screen"></div>
    <div id="privacy"></div>
    <script defer src="src/js/nav.js"></script>
    <script>
        const loadComponents = (id, url) =>  {
            return fetch(url)
            .then((response) => response.text())
            .then((html) => {
                document.getElementById(id).innerHTML = html;
            });
        }

        window.onload = async () => {
            await loadComponents('privacy', '../sections/privacy_part.html');
            await loadComponents('nav', '../sections/navigation.html');
        }
    </script>
</body>

</html>
